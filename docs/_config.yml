title: ARAAC
tagline: Australian Responsible Autonomous Agents Collective
email: c.foale@federation.edu.au
description: >-
  The Australian Responsible Autonomous Agents Collective (ARAAC) is a
  cross-institutional group of AI researchers advancing responsible, aligned,
  and explainable artificial intelligence — specialising in multi-objective
  reinforcement learning, explainability, transparency, and AI safety.
url: "https://araac.au" # the canonical hostname & protocol (matches docs/CNAME)

permalink: pretty

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  researchers:
    output: true
  projects:
    output: true

defaults:
  - scope:
      path: ""
      type: researchers
    values:
      layout: researcher
      seo:
        type: WebPage # jekyll-seo-tag's auto JSON-LD describes the page; the Person entity is hand-rolled in the layout
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      seo:
        type: WebPage # see above — the ResearchProject entity is hand-rolled in the layout
