# Big ol' list of publications.
#
# Sadly Jekyll doesn't really support BibTeX.
#
# These are listed on both researcher profiles pages, as well as on 
# project/topic pages.
#
# Publications can be attached to zero or more projects, and will be
# listed on all of them in reverse date order.
#
# If there's value in flagging "key papers" let Cam know.
#
# Each publication needs:
#   title:    full paper title (required)
#   year:     publication year (required; used for sort, newest first)
#   venue:    journal / conference name (optional)
#   url:      link to paper, DOI preferred (optional)
#   projects: list of project slugs this paper relates to — must match the
#             `slug` in docs/_projects/*.md (morl, ai_safety, explainable_ai,
#             human_agent_interaction)
#   authors:  ordered list. Each author is { name: "...", ref: <slug> }.
#             `ref` is OPTIONAL and only set for ARAAC members — it is the
#             researcher's _researchers/<slug>.md basename. Authors with a
#             ref are highlighted and linked to their profile page; authors
#             without one render as plain text.
#

