<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    {% seo %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": {{ '/' | absolute_url | append: '#organization' | jsonify }},
      "name": {{ site.title | jsonify }},
      "alternateName": {{ site.tagline | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "logo": {{ '/assets/images/araac-logo.png' | absolute_url | jsonify }},
      "description": {{ site.description | strip_newlines | strip | jsonify }}
    }
    </script>
    <link rel="icon" href="{{ "/favicon.ico" | relative_url }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/images/favicon-32x32.png" | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/images/favicon-16x16.png" | relative_url }}">
    <link rel="apple-touch-icon" href="{{ "/assets/images/apple-touch-icon.png" | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script defer src="{{ "/assets/js/main.js" | relative_url }}"></script>
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  </head>
  <body>
    <header>
      <a class="header-home" href="{{ "/" | relative_url }}">
        <img src="{{ "/assets/images/araac_logo.svg" | relative_url }}" alt="ARAAC Logo">
        <span class="site-name">Australian Responsible Autonomous Agents Collective</span>
      </a>
    </header>
    <nav class="site-nav" aria-label="Primary">
      <ul>
        <li><a href="{{ "/" | relative_url }}">Home</a></li>
        <li><a href="{{ "/" | relative_url }}#news">News</a></li>
        <li><a href="{{ "/" | relative_url }}#projects">Projects</a></li>
        <li><a href="{{ "/" | relative_url }}#researchers">People</a></li>
      </ul>
    </nav>
    {{ content }}
    <footer>

      <div class="institutions">
        <h4>ARAAC is supported by members from:</h4>
        <div class="logos">
            <a href="https://federation.edu.au"><img
                src="{{ "/assets/images/federation.png" | relative_url }}" alt="Federation University Australia"></a>
            <a href="https://www.deakin.edu.au"><img
                src="{{ "/assets/images/deakin.png" | relative_url }}" alt="Deakin University"></a>
            <a href="https://www.unsw.edu.au"><img
                src="{{ "/assets/images/unsw.png" | relative_url }}" alt="University of NSW"></a>
        </div>
    </div>

    <div class="institutions">
        <h4>ARAAC gratefully acknowledges the current and previous financial support from the following organizations:</h4>
        <div class="logos">
            <a href="https://www.founderspledge.com/"><img class="logo--wide"
                src="{{ "/assets/images/funding/founderspledge_logo.png" | relative_url }}" alt="Founders Pledge"></a>
            <a href="https://www.beri.org/"><img class="logo--medium"
                src="{{ "/assets/images/funding/beri_logo.webp" | relative_url }}" alt="BERI"></a>
            <a href="https://futureoflife.org/"><img class="logo--square"
                src="{{ "/assets/images/funding/fli_logo.png" | relative_url }}" alt="Future of Life Institute"></a>
        </div>
    </div>
    
    </footer>
  </body>
</html>
